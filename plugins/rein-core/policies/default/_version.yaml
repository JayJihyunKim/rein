# 기본 Policy 세트의 버전 메타데이터 — spec §3.4 Policy Versioning.
#
# 이 파일은 commit.yaml/push.yaml/push-testing.yaml/release.yaml 4개
# 정책 파일과 다른 폐쇄 스키마(version/compatible_versions)를 쓴다 —
# kernel/policy.py 의 VERSION_FIELDS/VERSION_FILENAME 참조. 파일명이
# 예약되어 있어 `load_policies(policy_dir)` 가 4필드 policy 스키마로
# 파싱을 시도하지 않고 건너뛴다. 이 값은 `load_policy_version(policy_dir)`
# 로만 읽는다.
#
# ── 값 "1" 선택 이유 (그냥 "왜") ────────────────────────────────────
# 이 세트가 code_review/security_review/tests_passed/user_approval
# evidence 판정에 처음으로 실제 소비되기 시작하는 시점(Phase 6 authority
# 전환)의 최초 배포 버전이다 — 이전에는 policy.version fact 의 정의된
# 출처 자체가 없어 네 capability 가 전부 영구 미충족이었으므로, 그 결손을
# 메우는 첫 값에 "1"보다 더 의미 있는 값은 없다. 다음 bump 는 이 세트의
# (trigger/when/require) 조합이 실제로 바뀌어 기존 evidence 의 유효성을
# 다시 판단해야 할 때만 한다 — bump 자체가 목적이 아니다.
version: 1
