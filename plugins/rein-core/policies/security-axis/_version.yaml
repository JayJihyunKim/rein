# plugins/rein-core/policies/security-axis/_version.yaml — security_review
# 축 전용. 정책 세트의 버전 메타데이터 (kernel/policy.py VERSION_FIELDS/
# VERSION_FILENAME 예약 파일 — commit-security.yaml 과 다른 폐쇄 스키마를
# 쓴다).
#
# 이것은 **배포 번들(distribution)에 동봉되는 기본 세트**다. security_review
# 축은 배포 기본값(rein/engine/authority.py DEFAULT_SWITCHED_CAPABILITIES)
# 으로 v2 전환돼 있어, 오버라이드 없는 사용자 프로젝트에서도 위임
# (hooks/lib/security-review-gate.sh 의 rein_security_review_delegate())이
# 이 폴더를 REIN_POLICY_DIR 로 해소한다. 프로젝트가 자기 규율을 조정하려면
# `<project>/.rein/policy/security-axis/` 에 같은 이름의 파일을 두면 그쪽이
# 우선한다(오버라이드). 둘 다 없으면 위임은 fail-closed 로 귀결된다 —
# hooks/lib/security-axis-policy-resolve.sh 의 정책 해소 계약 참조.
#
# 왜 이 디렉토리가 policies/default/ 와 따로인가 (task-axis 와 같은 이유,
# 다른 트리거): 이 폴더가 REIN_POLICY_DIR 로 명시 주입되는 경로는 이
# 축만의 tool.pre(git.commit) 요구를 policies/default/ 의 다른 요구(예:
# code_review)와 격리 평가하기 위해서다 — 같은 REIN_POLICY_DIR 값 하나로
# 여러 축을 동시에 표현하려 하면 두 요구가 서로 다른 위임 호출(서로 다른
# 서브프로세스, 서로 다른 REIN_POLICY_DIR)에서 각자 판정돼야 한다는
# 제약과 충돌한다.
#
# 이 디렉토리에는 이 파일과 commit-security.yaml 두 개만 둔다 — 번들
# 기본 세트(policies/default/)를 복제하지 않는다(드리프트 원천 차단).
#
# digest_scope 는 여기서 선언하지 않는다 — 미선언 시 기본값(sensitive
# 프로필, kernel/policy.py 참조)이 그대로 적용된다. `strict` 로 좁히고
# 싶은 프로젝트는 자신의 `.rein/policy/security-axis/_version.yaml`
# 오버라이드에 명시한다(이 파일은 오버라이드가 없는 프로젝트를 위한
# 배포 기본값이므로 더 엄격한 프로필을 강제하지 않는다).
version: 1
