# .rein/policy/task-axis/multiedit-task.yaml — active_task 축 전용 정책,
# MultiEdit 도구 이벤트. edit-task.yaml 과 완전히 동일한 스키마 —
# `when.tool` 값 하나만 다르다(OR 미지원이라 도구별 파일 분리,
# `_version.yaml` 헤더 참조).
#
# v1 대응: hooks/pre-edit-dod-gate.sh 의 PreToolUse(MultiEdit) 분기 —
# 활성 작업(DoD) 없이 소스 파일 MultiEdit 를 차단하는 지점의 미러.
trigger: tool.pre
when:
  tool: MultiEdit
require:
  - active_task
failure_mode: closed
